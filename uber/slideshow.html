<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Designing Uber</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1017;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;overflow:hidden;user-select:none;}

/* ── Chrome ── */
#chrome{position:fixed;top:0;left:0;right:0;height:44px;background:rgba(13,16,23,.95);border-bottom:1px solid #1e2540;display:flex;align-items:center;padding:0 20px;gap:12px;z-index:30;backdrop-filter:blur(8px);}
#act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .5s;}
#act-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;transition:color .5s;}
#slide-num{margin-left:auto;font-size:11px;color:#3a4468;font-variant-numeric:tabular-nums;}
#nav-hint{font-size:11px;color:#2e3560;}
.chrome-btn{font-size:11px;color:#3a4468;text-decoration:none;border:1px solid #1e2540;padding:3px 10px;border-radius:5px;transition:color .15s;}
.chrome-btn:hover{color:#8892b0;}
#progress{position:fixed;bottom:0;left:0;height:3px;background:#00b4d8;transition:width .4s ease,background .5s;z-index:30;}

/* ── Stage ── */
#stage{position:fixed;top:44px;left:0;right:0;bottom:0;display:flex;}
#content-panel{flex:0 0 65%;height:100%;position:relative;overflow:hidden;display:flex;align-items:center;padding:32px 52px 32px 56px;}
#map-panel{flex:0 0 35%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px 28px 24px 0;}
#map-panel.hidden{display:none;}
#content-panel.full{flex:0 0 100%;padding:0;}

/* ── Map panel ── */
.map-title{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#252a3d;margin-bottom:10px;text-align:center;}
#map-svg{width:100%;height:auto;}
.map-legend{display:flex;flex-direction:column;gap:5px;margin-top:14px;}
.leg-row{display:flex;align-items:center;gap:7px;font-size:10px;color:#2e3560;}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

/* ── Slide types ── */
.slide{width:100%;opacity:0;transform:translateY(16px);transition:opacity .38s ease,transform .38s ease;pointer-events:none;position:absolute;}
.slide.active{opacity:1;transform:translateY(0);pointer-events:all;position:relative;}
.slide.exit{opacity:0;transform:translateY(-16px);}

.s-act{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;display:inline-block;}
.s-title{font-size:34px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:10px;}
.s-sub{font-size:17px;color:#8892b0;line-height:1.6;margin-bottom:6px;}
.s-note{margin-top:20px;font-size:12px;color:#3a4468;border-top:1px solid #1e2540;padding-top:10px;}

/* Title (full screen) */
.slide--title{text-align:center;justify-content:center;align-items:center;flex-direction:column;padding:60px;}
.slide--title .s-title{font-size:52px;margin-bottom:16px;}

/* Callout */
.slide--callout .big-num{font-size:68px;font-weight:800;line-height:1;margin-bottom:6px;}
.slide--callout .big-unit{font-size:20px;color:#8892b0;margin-bottom:16px;}

/* Break */
.break-box{border-left:3px solid #dc2626;background:rgba(220,38,38,.07);border-radius:0 10px 10px 0;padding:16px 20px;margin-top:16px;}
.break-box p{font-size:17px;color:#fca5a5;line-height:1.65;}

/* Decision */
.why-nots{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.why-pill{background:#1a0d06;border:1px solid #4a2010;border-radius:6px;padding:5px 12px;font-size:12px;color:#fdba74;}
.why-pill span{color:#6b3010;margin-right:4px;}
.dec-box{border-left:3px solid #16a34a;background:rgba(22,163,74,.07);border-radius:0 10px 10px 0;padding:16px 20px;margin-top:4px;}
.dec-box p{font-size:16px;color:#86efac;line-height:1.65;}

/* Insight (2-col bad/good) */
.insight-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.ins-col{border-radius:10px;padding:16px 18px;}
.ins-col.bad{background:#140806;border:1px solid #3a1010;}
.ins-col.good{background:#081408;border:1px solid #103a10;}
.ins-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
.ins-col.bad .ins-head{color:#ef4444;}
.ins-col.good .ins-head{color:#16a34a;}
.ins-col p{font-size:14px;line-height:1.6;color:#8892b0;}
.ins-col p strong{color:#e2e8f0;}

/* Bullets (requirements, API) */
.item-list{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
.item-row{display:flex;gap:12px;align-items:flex-start;}
.item-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:3px 9px;border-radius:5px;background:#1e2a3a;color:#7dd3fc;white-space:nowrap;margin-top:2px;flex-shrink:0;}
.item-text{font-size:15px;color:#8892b0;line-height:1.5;}
.item-text strong{color:#e2e8f0;}

/* Agenda */
.agenda-list{margin-top:18px;display:flex;flex-direction:column;gap:12px;}
.ag-row{display:flex;gap:14px;align-items:flex-start;}
.ag-num{font-size:24px;font-weight:800;line-height:1;flex-shrink:0;width:36px;}
.ag-text{font-size:16px;color:#8892b0;padding-top:4px;line-height:1.4;}

/* Code */
.code-block{background:#0f1420;border:1px solid #1e2540;border-radius:10px;padding:18px 20px;font-family:'Cascadia Code','Fira Code',monospace;font-size:13px;color:#7dd3fc;line-height:1.75;margin-top:14px;white-space:pre;}

/* Table */
.data-tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px;}
.data-tbl th{padding:8px 12px;background:#0f1420;color:#3a4468;font-size:10px;text-transform:uppercase;letter-spacing:.06em;text-align:left;}
.data-tbl td{padding:10px 12px;border-bottom:1px solid #1a1f2e;line-height:1.4;}
.data-tbl tr:last-child td{border:none;}
.data-tbl td:first-child{color:#7dd3fc;font-weight:600;font-size:13px;}
.data-tbl td:last-child{color:#6b7594;font-size:13px;}

/* Failures */
.fail-list{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
.fail-row{display:flex;gap:12px;padding:12px 16px;border-radius:8px;border:1px solid #16a34a30;background:#081408;}
.fail-check{color:#16a34a;font-size:16px;flex-shrink:0;padding-top:1px;}
.fail-scenario{font-size:13px;font-weight:600;color:#c3cfe2;margin-bottom:3px;}
.fail-result{font-size:13px;color:#6b7594;line-height:1.4;}

/* Closing */
.closing-wrap{width:100%;max-width:800px;margin:0 auto;padding:60px;}
.closing-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;}
.closing-before{opacity:.5;}
.closing-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#3a4468;margin-bottom:16px;}
.closing-items{margin-top:40px;display:flex;flex-direction:column;gap:20px;}
.closing-item{display:flex;gap:16px;align-items:flex-start;}
.closing-n{font-size:28px;font-weight:800;line-height:1;flex-shrink:0;width:38px;}
.closing-text strong{display:block;font-size:17px;color:#e2e8f0;margin-bottom:3px;}
.closing-text span{font-size:14px;color:#6b7594;}

/* Animations */
@keyframes pulse-red{0%,100%{opacity:1;}50%{opacity:.5;}}
</style>
</head>
<body>

<div id="chrome">
  <div id="act-dot"></div>
  <span id="act-label"></span>
  <span id="slide-num"></span>
  <span id="nav-hint">Enter / → next &nbsp;·&nbsp; ← / Shift+Tab back &nbsp;·&nbsp; click to advance</span>
  <a href="hld.html" class="chrome-btn">Full HLD</a>
</div>

<div id="stage">
  <div id="content-panel"><div id="slide-mount"></div></div>
  <div id="map-panel">
    <div class="map-title">Architecture — current state</div>
    <svg id="map-svg" viewBox="0 0 312 174" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="map-legend">
      <div class="leg-row"><div class="leg-dot" style="background:#1e2540"></div>not yet introduced</div>
      <div class="leg-row"><div class="leg-dot" style="background:#374162"></div>in the system</div>
      <div class="leg-row" id="leg-active"><div class="leg-dot" style="background:#00b4d8"></div>focus of this slide</div>
      <div class="leg-row"><div class="leg-dot" style="background:#dc2626"></div>breaking point</div>
    </div>
  </div>
</div>
<div id="progress"></div>

<script>
// ── MAP NODE DEFINITIONS ──────────────────────────────────────────────────────
const N = {
  rider:      {x:2,   y:34,  w:52, h:20, label:"Rider"},
  driver:     {x:2,   y:62,  w:52, h:20, label:"Driver"},
  server_n:   {x:70,  y:48,  w:56, h:20, label:"API Server"},
  db_n:       {x:144, y:48,  w:56, h:20, label:"Database"},
  gateway:    {x:70,  y:48,  w:60, h:20, label:"Gateway"},
  location:   {x:148, y:4,   w:70, h:20, label:"Location Svc"},
  dispatch:   {x:148, y:32,  w:70, h:20, label:"Dispatch Svc"},
  trip:       {x:148, y:60,  w:70, h:20, label:"Trip Svc"},
  fare:       {x:148, y:88,  w:70, h:20, label:"Fare Svc"},
  ringpop:    {x:148, y:116, w:70, h:20, label:"Ringpop"},
  redis_geo:  {x:230, y:4,   w:78, h:20, label:"Redis Geo"},
  redis_lock: {x:230, y:32,  w:78, h:20, label:"Redis Lock"},
  kafka:      {x:230, y:60,  w:78, h:20, label:"Kafka"},
  postgres:   {x:230, y:88,  w:78, h:20, label:"PostgreSQL"},
  cassandra:  {x:230, y:116, w:78, h:20, label:"Cassandra"},
  temporal:   {x:230, y:144, w:78, h:20, label:"Temporal"},
};

const CONNS = [
  ['rider','server_n'],['driver','server_n'],['server_n','db_n'],
  ['rider','gateway'],['driver','gateway'],
  ['gateway','location'],['gateway','dispatch'],['gateway','trip'],['gateway','fare'],
  ['location','redis_geo'],['location','kafka'],
  ['dispatch','redis_geo'],['dispatch','redis_lock'],['dispatch','ringpop'],
  ['kafka','cassandra'],
  ['trip','postgres'],['trip','temporal'],
];

const PROD_NODES = ['gateway','location','dispatch','trip','fare','ringpop','redis_geo','redis_lock','kafka','postgres','cassandra','temporal'];
const NAIVE_NODES = ['server_n','db_n'];

// ── BUILD MAP SVG ─────────────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs={}) {
  const el = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
  return el;
}

(function buildMap() {
  const svg = document.getElementById('map-svg');

  // Glow filters
  const defs = svgEl('defs');
  defs.innerHTML = `
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>`;
  svg.appendChild(defs);

  // Connection lines
  const cg = svgEl('g', {id:'conns'});
  CONNS.forEach(([a,b]) => {
    const na = N[a], nb = N[b];
    if (!na || !nb) return;
    const line = svgEl('line', {
      id:`c-${a}-${b}`,
      x1: na.x + na.w, y1: na.y + na.h/2,
      x2: nb.x,        y2: nb.y + nb.h/2,
      stroke:'#1e2540', 'stroke-width':'1',
    });
    line.style.transition = 'stroke .5s, opacity .5s';
    line.style.opacity = '0';
    cg.appendChild(line);
  });
  svg.appendChild(cg);

  // Node groups
  const ng = svgEl('g', {id:'nodes'});
  Object.entries(N).forEach(([id, n]) => {
    const g = svgEl('g', {id:`nd-${id}`});
    const rect = svgEl('rect', {id:`nd-${id}-r`, x:n.x, y:n.y, width:n.w, height:n.h, rx:'5'});
    rect.style.transition = 'fill .45s, stroke .45s, filter .45s';
    const txt = svgEl('text', {
      id:`nd-${id}-t`, x:n.x+n.w/2, y:n.y+n.h/2,
      'text-anchor':'middle', 'dominant-baseline':'central',
      'font-size':'7.2', 'font-family':'Segoe UI,system-ui,sans-serif', 'font-weight':'500'
    });
    txt.style.transition = 'fill .45s';
    txt.textContent = n.label;
    g.appendChild(rect);
    g.appendChild(txt);
    ng.appendChild(g);
  });
  svg.appendChild(ng);

  // Set everything to ghost initially
  Object.keys(N).forEach(id => setNode(id, 'ghost'));
})();

function setNode(id, state, color) {
  const r = document.getElementById(`nd-${id}-r`);
  const t = document.getElementById(`nd-${id}-t`);
  if (!r || !t) return;
  if (state === 'ghost') {
    r.style.fill='#0d1017'; r.style.stroke='#161c2a'; r.style.filter='none';
    t.style.fill='#1e2540';
  } else if (state === 'visible') {
    r.style.fill='#141c2a'; r.style.stroke='#2a3358'; r.style.filter='none';
    t.style.fill='#5a6494';
  } else if (state === 'active') {
    const c = color||'#00b4d8';
    r.style.fill=hexA(c,.12); r.style.stroke=c; r.style.filter='url(#glow)';
    t.style.fill=c;
  } else if (state === 'broken') {
    r.style.fill='#1a0606'; r.style.stroke='#dc2626'; r.style.filter='url(#glow-red)';
    t.style.fill='#f87171';
  }
}

function hexA(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function updateMap(state) {
  const show = new Set(state.show||[]);
  const broken = new Set(state.broken||[]);

  Object.keys(N).forEach(id => {
    if (broken.has(id))       setNode(id,'broken');
    else if (id===state.active) setNode(id,'active',state.activeColor||'#00b4d8');
    else if (show.has(id))    setNode(id,'visible');
    else                      setNode(id,'ghost');
  });

  // Update connection lines
  CONNS.forEach(([a,b]) => {
    const line = document.getElementById(`c-${a}-${b}`);
    if (!line) return;
    const aVis = show.has(a)||broken.has(a)||a===state.active;
    const bVis = show.has(b)||broken.has(b)||b===state.active;
    if (aVis && bVis) {
      line.style.opacity = '0.5';
      if (broken.has(b)||broken.has(a)) line.setAttribute('stroke','#3a1010');
      else if (b===state.active||a===state.active) line.setAttribute('stroke', hexA(state.activeColor||'#00b4d8',.5));
      else line.setAttribute('stroke','#252a44');
    } else {
      line.style.opacity = '0';
    }
  });
}

// ── SLIDE DATA ────────────────────────────────────────────────────────────────
const ALL = ['rider','driver','gateway','location','dispatch','trip','fare','ringpop','redis_geo','redis_lock','kafka','postgres','cassandra','temporal'];
const NAIVE = ['rider','driver','server_n','db_n'];
const BROKEN_ALL = ['rider','driver','server_n','db_n'];

const SLIDES = [
  // ── ACT 1: THE BET ───────────────────────────────────────────────────────
  {
    act:'',actColor:'#00b4d8',full:true,
    map:{show:[],active:null,broken:[]},
    html:`<div class="slide slide--title">
      <div class="s-act" style="color:#00b4d8">System Design Interview</div>
      <div class="s-title">Designing Uber</div>
      <div class="s-sub">Every component earned through a problem.<br>Not one assumed upfront.</div>
      <div class="s-note" style="margin-top:32px">Enter / → to advance &nbsp;·&nbsp; ← to go back &nbsp;·&nbsp; click right side to advance</div>
    </div>`
  },
  {
    act:'The Stakes',actColor:'#00b4d8',
    map:{show:['rider','driver'],active:null,broken:[]},
    html:`<div class="slide">
      <div class="s-act" style="color:#00b4d8">The Stakes</div>
      <div class="s-title">Two users. One contract.</div>
      <div class="item-list">
        <div class="item-row"><span class="item-label">Rider</span><span class="item-text">Request a ride, see fare + ETA before confirming, track driver, cancel.</span></div>
        <div class="item-row"><span class="item-label">Driver</span><span class="item-text">Go online/offline, accept or reject ride offers, stream GPS every ~5s.</span></div>
        <div class="item-row"><span class="item-label">System</span><span class="item-text">Match in <strong>&lt;1 second</strong> · 99.99% uptime · <strong>one driver per rider, always</strong>.</span></div>
        <div class="item-row"><span class="item-label" style="background:#1f0808;color:#f87171">Out of scope</span><span class="item-text">Payments, surge algorithm, maps engine, driver KYC.</span></div>
      </div>
    </div>`
  },
  {
    act:'The Stakes',actColor:'#ef4444',
    map:{show:['rider','driver'],active:null,broken:[]},
    html:`<div class="slide slide--callout">
      <div class="s-act" style="color:#ef4444">The Constraint That Shapes Everything</div>
      <div class="big-num" style="color:#ef4444">1,000,000</div>
      <div class="big-unit">location writes / second</div>
      <div class="s-sub" style="max-width:480px">5M active drivers × one GPS ping every 5 seconds.</div>
      <div class="s-sub" style="max-width:480px;margin-top:8px">Almost every architecture decision below traces back to this single number.</div>
    </div>`
  },

  // ── ACT 2: THE NAIVE DESIGN BREAKS ───────────────────────────────────────
  {
    act:'Naive Design',actColor:'#f59e0b',
    map:{show:['rider','driver','server_n','db_n'],active:null,broken:[]},
    html:`<div class="slide">
      <div class="s-act" style="color:#f59e0b">Naive Design</div>
      <div class="s-title">Start with the simplest thing.</div>
      <div class="s-sub" style="margin-top:8px">Rider + Driver apps talk to one API server. Drivers POST location every 5s. Server queries the database for nearby drivers and assigns one.</div>
      <div class="s-sub" style="margin-top:16px;color:#3a4468">This is a valid starting point. Now let's find where it breaks.</div>
      <div class="s-note">Watch the map on the right — it shows the current system state.</div>
    </div>`
  },
  {
    act:'Break #1',actColor:'#ef4444',
    map:{show:NAIVE,active:null,broken:['db_n']},
    html:`<div class="slide">
      <div class="s-act" style="color:#ef4444">Break #1</div>
      <div class="s-title">The database can't keep up.</div>
      <div class="break-box"><p>5M drivers × 1 update/5s = <strong>1,000,000 writes/sec</strong>.<br>PostgreSQL handles ~10K. We are <strong>100× over the limit</strong> before a single rider has booked anything.<br><br>DynamoDB on-demand at this volume: $200K+/day in write capacity alone.</p></div>
      <div class="s-note">Database highlighted red on the map.</div>
    </div>`
  },
  {
    act:'Break #2',actColor:'#ef4444',
    map:{show:NAIVE,active:null,broken:['db_n']},
    html:`<div class="slide">
      <div class="s-act" style="color:#ef4444">Break #2</div>
      <div class="s-title">Proximity queries are too slow.</div>
      <div class="break-box"><p>"Find drivers within 5km" on 5M rows without spatial indexing is a <strong>full table scan</strong>.<br><br>Add a spatial index — now <strong>re-indexing under a 1M writes/sec write storm</strong> degrades the entire database.</p></div>
    </div>`
  },
  {
    act:'Break #3',actColor:'#ef4444',
    map:{show:NAIVE,active:null,broken:['server_n','db_n']},
    html:`<div class="slide">
      <div class="s-act" style="color:#ef4444">Break #3</div>
      <div class="s-title">Two servers. Same driver.</div>
      <div class="break-box"><p>We run multiple API instances for scale. Two instances simultaneously select the <strong>same available driver</strong> for two different riders.<br><br>Without coordination, one rider's driver simply never shows up.</p></div>
    </div>`
  },
  {
    act:'Break #4',actColor:'#ef4444',
    map:{show:NAIVE,active:null,broken:BROKEN_ALL},
    html:`<div class="slide">
      <div class="s-act" style="color:#ef4444">Break #4</div>
      <div class="s-title">Polling buries the server.</div>
      <div class="break-box"><p>Riders poll "where's my driver?" every 5s during trips.<br><strong>315K concurrent trips × 12 req/min = 3.8M requests/min</strong> of mostly empty responses.<br><br>Every round-trip is wasted server capacity.</p></div>
    </div>`
  },
  {
    act:'Design Agenda',actColor:'#f59e0b',
    map:{show:NAIVE,active:null,broken:BROKEN_ALL},
    html:`<div class="slide">
      <div class="s-act" style="color:#f59e0b">Design Agenda</div>
      <div class="s-title">Four breaks. Four fixes.</div>
      <div class="agenda-list">
        <div class="ag-row"><div class="ag-num" style="color:#ef4444">01</div><div class="ag-text">1M location writes/sec — the database can't handle it</div></div>
        <div class="ag-row"><div class="ag-num" style="color:#8b5cf6">02</div><div class="ag-text">Finding the best driver nearby in under 100ms</div></div>
        <div class="ag-row"><div class="ag-num" style="color:#f97316">03</div><div class="ag-text">One driver, one rider — no race condition</div></div>
        <div class="ag-row"><div class="ag-num" style="color:#16a34a">04</div><div class="ag-text">Real-time tracking without 3.8M empty polls/min</div></div>
      </div>
      <div class="s-note">Stating the agenda in an interview shows structure. The interviewer knows you won't miss anything.</div>
    </div>`
  },

  // ── ACT 3: FIX IT PIECE BY PIECE ─────────────────────────────────────────
  {
    act:'Fix #1 — Location',actColor:'#ef4444',
    map:{show:['rider','driver','gateway','location','redis_geo'],active:'redis_geo',activeColor:'#ef4444',broken:[]},

// ── RENDER ENGINE ─────────────────────────────────────────────────────────────
const mount  = document.getElementById('slide-mount');
const cpanel = document.getElementById('content-panel');
const mpanel = document.getElementById('map-panel');
let cur = 0, prev = -1;

function goTo(n) {
  if (n < 0 || n >= SLIDES.length) return;
  const s = SLIDES[n];

  // Swap slide content
  const old = mount.querySelector('.slide.active');
  if (old) {
    old.classList.add('exit');
    setTimeout(() => old.remove(), 400);
  }

  const wrap = document.createElement('div');
  wrap.innerHTML = s.html;
  const el = wrap.firstChild;
  el.classList.add('active');
  mount.appendChild(el);

  // Full-screen vs two-panel
  if (s.full) {
    cpanel.classList.add('full');
    mpanel.classList.add('hidden');
  } else {
    cpanel.classList.remove('full');
    mpanel.classList.remove('hidden');
  }

  // Update map
  updateMap(s.map);

  // Update chrome
  const leg = document.getElementById('leg-active');
  if (s.map.active && s.actColor) {
    leg.querySelector('.leg-dot').style.background = s.actColor;
    document.getElementById('act-dot').style.background = s.actColor;
    document.getElementById('act-label').style.color = s.actColor;
  } else {
    document.getElementById('act-dot').style.background = s.actColor||'#00b4d8';
    document.getElementById('act-label').style.color = s.actColor||'#00b4d8';
  }
  document.getElementById('act-label').textContent = s.act||'';
  document.getElementById('slide-num').textContent = `${n+1} / ${SLIDES.length}`;
  document.getElementById('progress').style.width = `${(n+1)/SLIDES.length*100}%`;
  document.getElementById('progress').style.background = s.actColor||'#00b4d8';

  cur = n;
}

// Init
goTo(0);

// Navigation
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='Enter') { e.preventDefault(); goTo(cur+1); }
  if (e.key==='ArrowLeft')                   { e.preventDefault(); goTo(cur-1); }
  if (e.key==='Tab'&&e.shiftKey)             { e.preventDefault(); goTo(cur-1); }
});
document.getElementById('stage').addEventListener('click', e => {
  e.clientX / window.innerWidth > 0.18 ? goTo(cur+1) : goTo(cur-1);
});
</script>
