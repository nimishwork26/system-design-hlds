<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Uber HLD — Mind Map</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0f1117; overflow:hidden; height:100vh; font-family:'Segoe UI',system-ui,sans-serif; }

    #hdr {
      position:fixed; top:0; left:0; right:0; height:50px;
      background:#1a1d27; border-bottom:1px solid #2e3354;
      display:flex; align-items:center; padding:0 18px; gap:10px; z-index:10;
    }
    .logo { font-size:14px; font-weight:700; color:#00b4d8; margin-right:4px; }
    .btn {
      background:#22263a; border:1px solid #2e3354; color:#8892b0;
      padding:4px 12px; border-radius:6px; font-size:12px; cursor:pointer;
      font-family:inherit; transition:background .15s,color .15s;
      text-decoration:none; display:inline-flex; align-items:center;
    }
    .btn:hover { background:#2e3354; color:#e2e8f0; }
    .btn.hi { border-color:#00b4d8; color:#7dd3fc; }
    .btn.hi:hover { background:#0c2230; }
    .hint { margin-left:auto; font-size:11px; color:#3a4466; }

    #legend {
      display:flex; gap:12px; align-items:center; margin-left:8px;
    }
    .leg { font-size:10.5px; display:flex; align-items:center; gap:4px; }
    .leg-dot { width:8px; height:8px; border-radius:50%; }

    #wrap { position:fixed; top:50px; left:0; right:0; bottom:0; }
    svg { width:100%; height:100%; cursor:grab; }
    svg:active { cursor:grabbing; }

    .link { fill:none; stroke-width:1.5; opacity:0.3; }
    .node { cursor:pointer; }
    .node rect { stroke-width:1.5; }
    .node:hover rect { filter:brightness(1.5); }
    text { pointer-events:none; font-family:'Segoe UI',system-ui,sans-serif; }
  </style>
</head>
<body>

<div id="hdr">
  <span class="logo">Uber — Mind Map</span>
  <button class="btn" id="btn-expand">Expand All</button>
  <button class="btn" id="btn-collapse">Collapse</button>
  <button class="btn" id="btn-fit">Fit View</button>
  <a href="hld.html" class="btn hi">Full HLD →</a>
  <div id="legend"></div>
  <span class="hint">Click to expand · Scroll to zoom · Drag to pan</span>
</div>

<div id="wrap"><svg id="svg"><g id="g"></g></svg></div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const DATA = {
  name:"Uber HLD", children:[
    { name:"Requirements", children:[
      { name:"Functional", children:[
        { name:"Rider", children:[
          {name:"Request ride: pickup → dropoff"},
          {name:"Fare estimate + ETA before confirm"},
          {name:"Real-time driver tracking"},
          {name:"Cancel + rate driver"}
        ]},
        { name:"Driver", children:[
          {name:"Go online / offline"},
          {name:"Accept or reject ride offers"},
          {name:"Stream GPS every ~5s"},
          {name:"Rate rider after trip"}
        ]}
      ]},
      { name:"Non-Functional", children:[
        {name:"Driver match < 1 second"},
        {name:"99.99% availability"},
        {name:"No double driver assignment"},
        {name:"10M trips/day, 5M active drivers"},
        {name:"Real-time push via WebSockets"}
      ]},
      { name:"Out of Scope", children:[
        {name:"Payments"},
        {name:"Surge pricing algorithm"},
        {name:"Maps / routing engine"},
        {name:"Driver KYC & onboarding"}
      ]}
    ]},

    { name:"Capacity", children:[
      {name:"10M trips/day → ~350/sec peak (3×)"},
      {name:"5M active drivers online"},
      {name:"⚡ 1M location writes/sec ← KEY"},
      {name:"Live driver index: ~500 MB (fits RAM)"},
      {name:"Trip records: 10 GB/day → 3.6 TB/yr"}
    ]},

    { name:"API Design", children:[
      { name:"POST /fare", children:[
        {name:"Returns fare_id with 2-min TTL"},
        {name:"Prevents client price manipulation"},
        {name:"Calls Maps API for road ETA"}
      ]},
      { name:"POST /rides { fare_id }", children:[
        {name:"Server fetches fare from DB"},
        {name:"Creates trip: status = SEARCHING"}
      ]},
      { name:"PATCH /rides/:id", children:[
        {name:"action: accept | reject"},
        {name:"Updates driver status in Redis + PG"}
      ]},
      { name:"POST /drivers/location", children:[
        {name:"Called every ~5s from driver app"},
        {name:"driver_id from JWT — not body"},
        {name:"Adaptive freq: fast near pickup"}
      ]}
    ]},

    { name:"Architecture", children:[
      { name:"API Gateway", children:[
        {name:"JWT auth + rate limiting"},
        {name:"Routes to services"},
        {name:"WebSocket connections"}
      ]},
      { name:"Location Service", children:[
        {name:"Ingests 1M GPS pings/sec"},
        {name:"GEOADD → Redis Geo"},
        {name:"Publishes → Kafka (geo-partitioned)"}
      ]},
      { name:"Dispatch Service", children:[
        {name:"GEOSEARCH Redis for nearby drivers"},
        {name:"Score: ETA → rating → accept rate"},
        {name:"Redis SETNX lock on best driver"},
        {name:"Ringpop routes to correct node"}
      ]},
      { name:"Trip Service", children:[
        {name:"Manages trip lifecycle + state"},
        {name:"ACID writes to PostgreSQL"},
        {name:"Orchestrates via Temporal"}
      ]},
      { name:"Fare Service", children:[
        {name:"Road ETA via Maps API"},
        {name:"Applies surge multiplier"},
        {name:"Stores fare_id (TTL: 2 min)"}
      ]},
      { name:"Notification Service", children:[
        {name:"APNs → iOS"},
        {name:"FCM → Android"},
        {name:"WebSocket → active trip updates"}
      ]}
    ]},

    { name:"Deep Dives", children:[
      { name:"1M Writes/sec", children:[
        { name:"❌ Direct DB writes", children:[
          {name:"DynamoDB: $200K+/day"},
          {name:"PG can't sustain 1M/sec"}
        ]},
        { name:"✓ Batch + PostGIS", children:[
          {name:"Aggregates over 5–10s windows"},
          {name:"Tradeoff: location lags reality"}
        ]},
        { name:"✅ Redis + Kafka + Cassandra", children:[
          {name:"GEOADD: O(log n), overwrites position"},
          {name:"GEOSEARCH: sub-ms proximity query"},
          {name:"Kafka → Cassandra: durable history"},
          {name:"Redis repopulates in 5s on restart"}
        ]}
      ]},
      { name:"Geo Indexing", children:[
        { name:"Geohash", children:[
          {name:"Base-32 string encoding"},
          {name:"Edge artifacts at cell boundaries"}
        ]},
        { name:"Google S2", children:[
          {name:"64-bit hierarchical cell IDs"},
          {name:"Non-uniform cell area"}
        ]},
        { name:"H3 ← Uber uses this", children:[
          {name:"Hexagonal cells"},
          {name:"All 6 neighbors equidistant"},
          {name:"Level 9 ≈ 175m resolution"}
        ]}
      ]},
      { name:"Double Assignment", children:[
        { name:"❌ App-level locks", children:[
          {name:"Race conditions across instances"},
          {name:"State lost on crash"}
        ]},
        { name:"✓ DB status transitions", children:[
          {name:"available → outstanding_request"},
          {name:"In-memory timeouts lost on restart"}
        ]},
        { name:"✅ Redis SETNX + TTL", children:[
          {name:"SET driver:{id}:lock 1 EX 10 NX"},
          {name:"Atomic — only one caller wins"},
          {name:"Auto-expires, no manual cleanup"}
        ]}
      ]},
      { name:"Driver Non-response", children:[
        { name:"❌ in-memory setTimeout", children:[
          {name:"Lost on service restart"}
        ]},
        { name:"✓ Kafka delay queue", children:[
          {name:"Durable but no native delay support"}
        ]},
        { name:"✅ Temporal workflow", children:[
          {name:"Durable sleep — survives crashes"},
          {name:"Auto-retry with next candidate"},
          {name:"Whole cascade = one persisted workflow"}
        ]}
      ]},
      { name:"Ringpop", children:[
        {name:"Problem: offer to wrong WS node → dropped"},
        {name:"Consistent hashing: H3 cell → node"},
        {name:"SWIM gossip: decentralized health"},
        {name:"Transparent request forwarding"},
        {name:"Why not ZooKeeper? → bottleneck"}
      ]},
      { name:"GPS Accuracy", children:[
        {name:"Urban canyons: 50–100m GPS error"},
        {name:"Map-matching via Hidden Markov Models"},
        {name:"Snaps coordinates to road network"},
        {name:"Predictive: heading + speed"},
        {name:"83m staleness → < 10m effective"}
      ]}
    ]},

    { name:"Data Models", children:[
      { name:"trips (PostgreSQL)", children:[
        {name:"trip_id, fare_id, rider_id, driver_id"},
        {name:"status ENUM — 8 states"},
        {name:"pickup/dropoff lat/lng"},
        {name:"fare_estimate, fare_final, timestamps"}
      ]},
      { name:"fares (PostgreSQL)", children:[
        {name:"fare_id UUID PK"},
        {name:"surge_mult DECIMAL"},
        {name:"expires_at — 2-min TTL"}
      ]},
      { name:"location_history (Cassandra)", children:[
        {name:"PK: (driver_id, recorded_at)"},
        {name:"Append-only, never updated"},
        {name:"lat, lng, heading, speed, trip_id"}
      ]},
      { name:"Redis patterns", children:[
        {name:"geo:drivers:{city} — GEOADD/GEOSEARCH"},
        {name:"driver:{id}:lock — SETNX EX 10 NX"},
        {name:"driver:{id} — HSET (status, lat, lng)"},
        {name:"ws:sessions — WebSocket routing"}
      ]}
    ]},

    { name:"Trade-offs", children:[
      { name:"Strong Consistency", children:[
        {name:"Driver assignment — Redis SETNX"},
        {name:"Billing / trips — PostgreSQL ACID"}
      ]},
      { name:"Eventual OK", children:[
        {name:"Driver positions (5s lag fine)"},
        {name:"Location history (async Kafka)"}
      ]},
      { name:"Redis vs Cassandra", children:[
        {name:"Redis: ephemeral, sub-ms, current state"},
        {name:"Cassandra: durable, write-heavy, history"}
      ]},
      { name:"WebSockets vs Polling", children:[
        {name:"WS: ~50ms push, stateful"},
        {name:"Polling: 5s delay, 200K req/sec wasted"}
      ]}
    ]},

    { name:"Failure & Scale", children:[
      { name:"2015 Outage Lesson", children:[
        {name:"DB failover → 30-min global outage"},
        {name:"Fix: remove DB from hot path"},
        {name:"Geo index → in-memory only"}
      ]},
      { name:"Redis crash", children:[
        {name:"Repopulates in 5s from pings"},
        {name:"Trip state safe in PostgreSQL"},
        {name:"Locks auto-expire via TTL"}
      ]},
      { name:"Dispatch crash", children:[
        {name:"Temporal replays from checkpoint"},
        {name:"No dropped rides"}
      ]},
      { name:"Geo-sharding", children:[
        {name:"Per city: geo:drivers:nyc"},
        {name:"Blast radius containment"},
        {name:"Data residency compliance"}
      ]},
      { name:"Scale Targets", children:[
        {name:"Location: 1M/sec → Redis shards"},
        {name:"Dispatch: 350/sec → Kafka + autoscale"},
        {name:"WS: 10M → ~1K servers @ 10K each"},
        {name:"Cassandra: add nodes, RF=3"}
      ]}
    ]}
  ]
};

// ── COLORS ────────────────────────────────────────────────────────────────────
const C = {
  root:             {fill:"#0c1f2e", stroke:"#00b4d8", text:"#38bdf8"},
  "Requirements":   {fill:"#081c28", stroke:"#00b4d8", text:"#7dd3fc"},
  "Capacity":       {fill:"#1e1203", stroke:"#f59e0b", text:"#fcd34d"},
  "API Design":     {fill:"#031a10", stroke:"#10b981", text:"#6ee7b7"},
  "Architecture":   {fill:"#110a28", stroke:"#8b5cf6", text:"#c4b5fd"},
  "Deep Dives":     {fill:"#1e0505", stroke:"#ef4444", text:"#fca5a5"},
  "Data Models":    {fill:"#031520", stroke:"#06b6d4", text:"#67e8f9"},
  "Trade-offs":     {fill:"#1a0c03", stroke:"#f97316", text:"#fdba74"},
  "Failure & Scale":{fill:"#1a0510", stroke:"#ec4899", text:"#f9a8d4"},
  _default:         {fill:"#141720", stroke:"#374162", text:"#8892b0"}
};

function col(d) {
  if (d.depth === 0) return C.root;
  let n = d; while (n.depth > 1) n = n.parent;
  return C[n.data.name] || C._default;
}

// legend
const SECTIONS = ["Requirements","Capacity","API Design","Architecture","Deep Dives","Data Models","Trade-offs","Failure & Scale"];
const leg = document.getElementById("legend");
SECTIONS.forEach(s => {
  const el = document.createElement("span");
  el.className = "leg";
  el.innerHTML = `<span class="leg-dot" style="background:${C[s].stroke}"></span><span style="color:${C[s].text};font-size:10px">${s}</span>`;
  leg.appendChild(el);
});

// ── HELPERS ───────────────────────────────────────────────────────────────────
const NH = 28;
const CW = [8.5, 8, 7.2, 6.8]; // char width per depth
const MAXW = [190, 170, 300, 290];
const MINW = [130, 120, 88, 80];

function nw(d) {
  const dep = Math.min(d.depth, 3);
  return Math.max(MINW[dep], Math.min(MAXW[dep], d.data.name.length * CW[dep] + 28));
}

function label(d) {
  const dep = Math.min(d.depth, 3);
  const max = Math.floor((nw(d) - 20) / CW[dep]);
  const t = d.data.name;
  return t.length > max ? t.slice(0, max - 1) + "…" : t;
}

function rx(d) {
  if (d.depth === 0) return 10;
  return (!d.children && !d._children) ? 12 : 6;
}

function bezier(s, t) {
  const mx = (s.y + t.y) / 2;
  return `M${s.y},${s.x}C${mx},${s.x} ${mx},${t.x} ${t.y},${t.x}`;
}

// ── D3 SETUP ──────────────────────────────────────────────────────────────────
const svg  = d3.select("#svg");
const g    = d3.select("#g");
const wrap = document.getElementById("wrap");
const DUR  = 380;
let uid = 0;

const zoom = d3.zoom().scaleExtent([0.1, 3])
  .on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

const layout = d3.tree()
  .nodeSize([NH + 14, 240])
  .separation((a, b) => a.parent === b.parent ? 1.2 : 1.8);

const root = d3.hierarchy(DATA);
root.each(d => {
  d.id = ++uid;
  d.x0 = 0; d.y0 = 0;
  if (d.depth >= 1 && d.children) { d._children = d.children; d.children = null; }
});

// ── UPDATE ────────────────────────────────────────────────────────────────────
function update(src) {
  layout(root);
  const nodes = root.descendants();
  const links = root.links();

  // Links
  const lsel = g.selectAll("path.link").data(links, d => d.target.id);
  lsel.enter().insert("path","g.node").attr("class","link")
    .attr("d", () => bezier({y:src.y0,x:src.x0},{y:src.y0,x:src.x0}))
    .attr("stroke", d => col(d.target).stroke)
  .merge(lsel).transition().duration(DUR)
    .attr("d", d => bezier(d.source, d.target))
    .attr("stroke", d => col(d.target).stroke);
  lsel.exit().transition().duration(DUR)
    .attr("d", () => bezier({y:src.y,x:src.x},{y:src.y,x:src.x})).remove();

  // Nodes
  const nsel = g.selectAll("g.node").data(nodes, d => d.id);

  const ent = nsel.enter().append("g").attr("class","node")
    .attr("transform", `translate(${src.y0},${src.x0})`).attr("opacity", 0)
    .on("click", (_, d) => {
      if (d.children) { d._children = d.children; d.children = null; }
      else if (d._children) { d.children = d._children; d._children = null; }
      update(d);
    });
  ent.append("title");
  ent.append("rect");
  ent.append("text").attr("class","lbl");
  ent.append("text").attr("class","badge");

  const all = ent.merge(nsel);

  all.transition().duration(DUR)
    .attr("transform", d => `translate(${d.y},${d.x})`).attr("opacity", 1);

  all.select("title").text(d => d.data.name);

  all.select("rect")
    .attr("x", d => -nw(d)/2).attr("y", -NH/2)
    .attr("width", d => nw(d)).attr("height", NH)
    .attr("rx", d => rx(d))
    .attr("fill", d => col(d).fill).attr("stroke", d => col(d).stroke)
    .attr("stroke-width", d => d.depth === 0 ? 2 : 1.5);

  all.select("text.lbl")
    .attr("text-anchor","middle").attr("dominant-baseline","central")
    .attr("fill", d => col(d).text)
    .attr("font-size", d => [13.5,12,11,10.5][Math.min(d.depth,3)])
    .attr("font-weight", d => d.depth <= 1 ? 600 : 400)
    .text(d => label(d));

  all.select("text.badge")
    .attr("text-anchor","middle").attr("dominant-baseline","central")
    .attr("x", d => nw(d)/2 - 11).attr("y", -NH/2 + 8)
    .attr("font-size", 9).attr("font-weight", 700)
    .attr("fill", d => col(d).stroke)
    .text(d => d._children ? `+${d._children.length}` : "");

  nsel.exit().transition().duration(DUR)
    .attr("transform", `translate(${src.y},${src.x})`).attr("opacity", 0).remove();

  root.each(d => { d.x0 = d.x; d.y0 = d.y; });
}

// ── FIT VIEW ──────────────────────────────────────────────────────────────────
function fitView(pad = 60) {
  const all = root.descendants();
  const xs = all.map(d => d.y), ys = all.map(d => d.x);
  const x0 = Math.min(...xs) - 100, x1 = Math.max(...xs) + 160;
  const y0 = Math.min(...ys) - pad,  y1 = Math.max(...ys) + pad;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const sc = Math.min(1, (W / (x1-x0)) * 0.92, (H / (y1-y0)) * 0.92);
  const tx = -x0*sc + (W - (x1-x0)*sc)/2;
  const ty = H/2 - (y0+y1)/2*sc;
  svg.transition().duration(500)
    .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(sc));
}

// ── INIT ──────────────────────────────────────────────────────────────────────
update(root);
fitView();

// ── CONTROLS ──────────────────────────────────────────────────────────────────
function expandAll(n) {
  if (n._children) { n.children = n._children; n._children = null; }
  (n.children||[]).forEach(expandAll);
}
function collapseAll(n) {
  (n.children||[]).forEach(collapseAll);
  if (n.depth >= 1 && n.children) { n._children = n.children; n.children = null; }
}

document.getElementById("btn-expand").onclick = () => {
  expandAll(root); update(root); setTimeout(() => fitView(80), DUR+60);
};
document.getElementById("btn-collapse").onclick = () => {
  collapseAll(root); update(root); setTimeout(fitView, DUR+60);
};
document.getElementById("btn-fit").onclick = fitView;
</script>
</body>
</html>
